[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefly-dl"
version = "0.1.0"
description = "Briefly NLP ML/DL scaffolding (DESIGNED / NOT IMPLEMENTED for neural training)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["briefly_dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
