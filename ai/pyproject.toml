[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefly-ai"
version = "0.1.0"
description = "Briefly assistive AI contracts (DESIGNED / NOT IMPLEMENTED for MVP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["briefly_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
