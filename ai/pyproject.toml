[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefly-ai"
version = "0.1.0"
description = "Briefly assistive AI (FastAPI explain + policy contracts)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[project.scripts]
briefly-ai = "briefly_ai.api.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["briefly_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
